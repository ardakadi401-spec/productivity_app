name: CI

# FAZ 1.7 - temel pipeline iskeleti: her push/PR'da build + analyze + test
# calistirir. Genisletilmis kapsam (release imzalama, Firestore Rules testi,
# vb.) ilgili fazlarda ele alinir.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test with coverage
        run: flutter test --coverage

      - name: Coverage summary
        # ROADMAP.md FAZ 16 "Test kapsamı raporlamasının CI pipeline'a
        # entegre edilmesi" — harici bir servis/hesap gerektirmeden, Domain
        # (%90+) ve Data (%70+) katman eşiklerine (Bölüm 19.3) göre satır
        # kapsamını CI loguna ve iş özetine yazar. `.g.dart` (üretilmiş kod)
        # hariç tutulur.
        run: |
          sudo apt-get update -y && sudo apt-get install -y lcov
          lcov --remove coverage/lcov.info '*.g.dart' -o coverage/lcov.filtered.info
          echo '## Test Coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          lcov --summary coverage/lcov.filtered.info 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.filtered.info
          retention-days: 14

      - name: Build debug APK
        run: flutter build apk --debug
